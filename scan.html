<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Analysis</title>
  <link rel="stylesheet" href="style.css?v=21" />
  <script src="shared.js?v=21"></script>
  <script>requireAdult("scan.html");</script>
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Text Analyzer</div>
        <div class="sub">Paste convo + optional screenshot</div>
      </div>
    </div>
    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
    </div>
  </nav>

  <div class="container">
    <div class="card grid-2">
      <div>
        <h2 style="margin:0 0 6px;">Paste the messages</h2>
        <p class="muted" style="margin:0 0 12px;">This version scores patterns from your pasted text.</p>

        <label for="scanText">Conversation text</label>
        <textarea id="scanText" rows="9" placeholder="Paste conversation text here..."></textarea>

        <div class="section">
          <label for="scanFile">Optional screenshot</label>
          <input id="scanFile" type="file" accept="image/*" />
          <div id="fileInfo" class="muted small" style="margin-top:8px;"></div>
          <img id="preview" alt="" style="display:none; margin-top:10px; width:100%; border-radius:16px; border:1px solid rgba(255,255,255,.12);" />
        </div>

        <div class="row" style="margin-top:12px;">
          <button class="btn primary" id="analyzeBtn" type="button">Analyze</button>
          <button class="btn ghost" id="clearBtn" type="button">Clear</button>
        </div>

        <p class="muted small" id="debugLine" style="margin-top:12px;"></p>
      </div>

      <div>
        <h2 style="margin:0 0 6px;">Result</h2>
        <p class="muted" style="margin:0 0 12px;">Score + explanation + signals it found.</p>

        <div class="tile">
          <div class="row" style="justify-content:space-between;">
            <div style="font-weight:900;">Delulu Signal %</div>
            <div class="muted small" id="scanMeta">No scan yet</div>
          </div>

          <div class="progress" style="margin:10px 0;"><div id="scanBar"></div></div>
          <div style="font-size:28px; font-weight:950;" id="scanPercent">--%</div>
          <div class="muted" id="scanSummary">Paste text and press Analyze.</div>

          <div class="hr"></div>
          <div id="signalsList" class="plan-quotes"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="scan.js?v=21"></script>
</body>
</html>
