<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Text Analysis</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Text Analysis</div>
        <div class="sub">Paste convo + get signals</div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="btn ghost" id="backBtn" type="button">Back</button>
      <a class="btn" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="game.html">Game</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2>Paste the messages</h2>
      <p class="muted">This looks for patterns like dry replies, shutdown words, and pressure texts.</p>

      <div class="form-grid section">
        <textarea id="convo" placeholder="Paste conversation text here..."></textarea>

        <div class="row">
          <button class="btn primary" id="analyzeBtn" type="button">Analyze</button>
          <button class="btn ghost" id="clearBtn" type="button">Clear</button>
        </div>
      </div>

      <div class="section">
        <h2>Result</h2>
        <div class="progress" style="margin:10px 0;">
          <div id="scanBar"></div>
        </div>
        <p class="muted" id="scanPercent">--% • No scan yet</p>

        <div class="item" style="margin-top:12px;">
          <h3 style="margin:0 0 8px;">What I noticed</h3>
          <ul id="notes">
            <li class="muted">Run a scan to see notes here.</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Back button fix
    document.getElementById("backBtn").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "menu.html";
    });

    // Age gate
    const APP_KEY="dd_app_v1";
    function getAppData(){ try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); } catch { return {}; } }
    const d=getAppData();
    if(!d.age || Number(d.age) < 18) window.location.href="index.html";
  </script>

  <script src="scan.js"></script>
</body>
</html>
