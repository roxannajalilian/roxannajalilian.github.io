<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Age Check</title>
  <link rel="stylesheet" href="style.css?v=8" />
</head>
<body>

  <!-- NO NAV ON PURPOSE (LOCKED PAGE) -->

  <div class="container">
    <div class="card" style="max-width:520px; margin:60px auto;">
      
      <div style="display:flex; gap:14px; align-items:center; margin-bottom:14px;">
        <div class="logo">DD</div>
        <div>
          <h1 style="margin:0;">Delulu Detector</h1>
          <p class="muted" style="margin:2px 0 0;">18+ only</p>
        </div>
      </div>

      <p class="muted">
        This app contains relationship and emotional analysis intended for adults.
        You must confirm you are <b>18 or older</b> to continue.
      </p>

      <div class="section">
        <label for="ageInput">Enter your age</label>
        <input
          id="ageInput"
          type="number"
          min="18"
          placeholder="18+ only"
        />
      </div>

      <p class="muted" id="errorText" style="display:none; color:#ff7a7a;">
        You must be 18 or older to use this app.
      </p>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="continueBtn" type="button">
          Continue
        </button>
      </div>

      <div class="hr"></div>

      <p class="muted" style="font-size:13px;">
        Your age is stored only to verify access. No personal data is shared.
      </p>

    </div>
  </div>

  <script>
    const APP_KEY = "dd_app_v1";

    function getAppData(){
      try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); }
      catch { return {}; }
    }
    function setAppData(data){
      localStorage.setItem(APP_KEY, JSON.stringify(data));
    }

    const ageInput = document.getElementById("ageInput");
    const continueBtn = document.getElementById("continueBtn");
    const errorText = document.getElementById("errorText");

    // 🔒 HARD LOCK: do NOT auto-redirect anywhere
    // User MUST click Continue

    continueBtn.addEventListener("click", () => {
      const age = Number(ageInput.value);

      // No input
      if (!age) {
        errorText.textContent = "Please enter your age.";
        errorText.style.display = "block";
        return;
      }

      // Under 18
      if (age < 18) {
        errorText.textContent = "Sorry — this app is 18+ only.";
        errorText.style.display = "block";
        return;
      }

      // ✅ Passed age check
      errorText.style.display = "none";

      const data = getAppData();
      data.age = age;
      data.ageVerifiedAt = Date.now();
      setAppData(data);

      // Only NOW allow entry
      window.location.href = "menu.html";
    });

    // Prevent Enter key bypass
    ageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        continueBtn.click();
      }
    });
  </script>

</body>
</html>
