<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text Analyzer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Text Analyzer</div>
        <div class="sub">Paste convo + optional screenshot</div>
      </div>
    </div>
    <div class="nav-actions">
      <button class="pill" id="menuBtn">Menu</button>
      <a class="pill" href="plan.html">Plan</a>
    </div>
  </nav>

  <main class="container">
    <div class="card twoCol">
      <section>
        <h2>Paste the messages</h2>
        <p class="muted">
          It looks for patterns (short replies, “seen”, “ok”, “??”, shutdown words, etc.).
        </p>

        <textarea id="text" class="textarea" placeholder="Paste conversation text here..."></textarea>

        <div class="fileRow">
          <label class="btn ghost">
            Choose screenshot
            <input id="file" type="file" accept="image/*,.txt" hidden />
          </label>
          <span class="muted tiny" id="fileName">No file chosen</span>
        </div>

        <div id="previewWrap" class="hidden">
          <div class="tiny muted">Screenshot preview:</div>
          <img id="preview" alt="preview" class="previewImg" />
        </div>

        <div class="row">
          <button class="btn primary" id="analyze">Analyze</button>
          <button class="btn ghost" id="back">Back</button>
          <button class="btn ghost" id="clear">Clear</button>
        </div>

        <p class="tiny muted" id="msg"></p>
      </section>

      <section class="resultSide">
        <h2>Result</h2>
        <div class="circleWrap">
          <div class="circle" id="circle">
            <div class="circleInner">
              <div class="big" id="pct">--%</div>
              <div class="muted tiny" id="label">No scan yet</div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <h3 class="tight">What I noticed</h3>
        <ul class="list" id="bullets">
          <li class="muted">Run a scan to see notes here.</li>
        </ul>
      </section>
    </div>
  </main>

  <script type="module" src="scan.js"></script>
</body>
</html>
