<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan Messages</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h2>Scan Texts</h2>
  <p>Upload a screenshot or use voice input (entertainment only)</p>

  <input type="file" accept="image/*" id="imageUpload">
  <button onclick="scanImage()">Scan Image</button>

  <h3>Voice Input</h3>
  <button id="startRecording">🎤 Record Voice</button>
  <canvas id="voiceWave" width="300" height="50"></canvas>
  <p id="voiceOutput"></p>

  <div id="analyzing" style="display:none; margin-top:20px; color:#0ff;">Analyzing...</div>
</div>
<script src="wave.js"></script>
<script src="script.js"></script>
</body>
</html>
