<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Analysis</title>
  <link rel="stylesheet" href="style.css?v=20" />

  <!-- 🔒 lock -->
  <script src="shared.js?v=20"></script>
  <script>requireAdult();</script>
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Analysis</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="game.html">Game</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <h2 style="margin:0 0 6px;">Scan a convo</h2>
      <p class="muted" style="margin:0 0 12px;">Paste text + optional screenshot/photo preview.</p>

      <label for="textBox">Conversation text</label>
      <textarea id="textBox" rows="6" placeholder="Paste the convo here..."></textarea>

      <div class="section">
        <label for="photoInput">Optional photo/screenshot</label>
        <input id="photoInput" type="file" accept="image/*" />

        <div id="preview" class="preview" style="display:none;">
          <img id="previewImg" alt="Preview" />
        </div>

        <p class="muted small" id="photoNote" style="margin:8px 0 0;"></p>
      </div>

      <div class="row">
        <button class="btn primary" id="analyzeBtn" type="button">Analyze</button>
        <button class="btn ghost" id="clearBtn" type="button">Clear</button>
      </div>

      <div class="section" id="resultBox" style="display:none;">
        <div class="hr"></div>
        <h2 style="margin:0 0 8px;">Result</h2>

        <div class="progress"><div id="scanBar"></div></div>
        <h3 id="scanPercent" style="margin:10px 0 6px;">0%</h3>
        <p class="muted" id="scanSummary" style="margin:0;"></p>

        <div class="tile section">
          <h3>What I noticed</h3>
          <ul id="signals" style="margin:8px 0 0; color:var(--muted); line-height:1.6;"></ul>
        </div>
      </div>
    </div>
  </div>

  <script src="scan.js?v=20"></script>
</body>
</html>
