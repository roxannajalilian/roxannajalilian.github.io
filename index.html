<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Start</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Age verification</div>
      </div>
    </div>
    <div class="nav-actions">
      <a class="btn" href="privacy.html">Privacy</a>
      <a class="btn ghost" href="menu.html">Menu</a>
    </div>
  </nav>

  <div class="container">
    <div class="card center" style="max-width:720px;margin:0 auto;">
      <h1 style="margin-bottom:6px;">Start</h1>
      <p class="muted">Enter your age to continue. You must be 18 or older.</p>

      <div class="section" style="text-align:left;">
        <label class="muted" for="ageInput" style="display:block;margin-bottom:8px;">Your age</label>
        <input id="ageInput" type="number" inputmode="numeric" min="1" max="120" placeholder="18" />

        <div style="margin-top:12px;">
          <label style="display:flex;gap:10px;align-items:flex-start;">
            <input type="checkbox" id="agreeBox" />
            <span class="small">
              I agree to the <a href="privacy.html" target="_blank"><b>Privacy & Concerns</b></a>
            </span>
          </label>
        </div>

        <p class="muted" id="errorText" style="display:none;margin-top:10px;"></p>

        <div class="row" style="margin-top:14px;">
          <button class="btn primary" id="continueBtn" type="button" disabled>Continue</button>
          <button class="btn ghost" id="resetBtn" type="button">Reset</button>
        </div>

        <p class="muted" style="margin-top:12px;">
          Tip: If your index keeps redirecting, open <b>index.html?stay=1</b>
        </p>
      </div>

      <div class="section item" id="lockBox" style="display:none;">
        <h2 style="margin:0 0 6px;">Sorry — 18+ only</h2>
        <p class="muted" id="lockMsg" style="margin:0;">Redirecting…</p>
      </div>
    </div>
  </div>

  <script>
    const APP_KEY = "dd_app_v1";
    function getAppData(){ try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); } catch { return {}; } }
    function setAppData(d){ localStorage.setItem(APP_KEY, JSON.stringify(d)); }

    const ageInput = document.getElementById("ageInput");
    const agreeBox = document.getElementById("agreeBox");
    const continueBtn = document.getElementById("continueBtn");
    const resetBtn = document.getElementById("resetBtn");
    const errorText = document.getElementById("errorText");
    const lockBox = document.getElementById("lockBox");
    const lockMsg = document.getElementById("lockMsg");

    function showError(msg){ errorText.style.display = "block"; errorText.textContent = msg; }
    function clearError(){ errorText.style.display = "none"; errorText.textContent = ""; }

    // enable continue only if agreed
    agreeBox.addEventListener("change", () => {
      continueBtn.disabled = !agreeBox.checked;
    });

    // ✅ FIX: only auto-skip to menu if NOT forcing stay
    (function autoSkip(){
      const params = new URLSearchParams(window.location.search);
      const stay = params.get("stay") === "1"; // open index.html?stay=1 to stay here
      if (stay) return;

      const data = getAppData();
      if (data && Number(data.age) >= 18) {
        window.location.href = "menu.html";
      }
    })();

    continueBtn.addEventListener("click", () => {
      clearError();
      const age = Number(ageInput.value);

      if(!age || age < 1 || age > 120){
        showError("Enter a valid age (1–120).");
        return;
      }

      const data = getAppData();
      data.age = age;
      setAppData(data);

      if(age < 18){
        lockBox.style.display = "block";
        lockMsg.textContent = "Sorry — you must be 18 or older to use this app. Redirecting…";
        setTimeout(() => window.location.href = "https://www.google.com", 1200);
        return;
      }

      window.location.href = "menu.html";
    });

    ageInput.addEventListener("keydown", (e) => {
      if(e.key === "Enter" && !continueBtn.disabled) continueBtn.click();
    });

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(APP_KEY);
      ageInput.value = "";
      agreeBox.checked = false;
      continueBtn.disabled = true;
      clearError();
      lockBox.style.display = "none";
      // keep you on the start page
      if (!window.location.search.includes("stay=1")) {
        window.location.href = "index.html?stay=1";
      }
    });
  </script>
</body>
</html>
