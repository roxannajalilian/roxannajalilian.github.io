<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Delulu Detector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <div class="nav-left brand">
    <div class="logo">DD</div>
    <div class="brand-text">
      <div class="title">Delulu Detector</div>
      <div class="sub">Multi-page • Vanilla HTML/CSS/JS</div>
    </div>
  </div>
  <div class="nav-right">
    <a class="navlink" href="index.html">Home</a>
    <a class="navlink" href="scan.html">Scan</a>
    <a class="navlink" href="quiz.html">Quiz</a>
    <a class="navlink" href="history.html">History</a>
    <a class="navlink" href="policy.html">Policy</a>
  </div>
</nav>

<div class="container">
  <div class="card center">
    <h1>Start</h1>
    <p class="muted">
      Enter your age to continue. Under 18 goes to Teen Mode first.
    </p>

    <div class="field">
      <label class="muted">Your age</label>
      <input id="ageInput" type="number" min="1" max="120" placeholder="e.g., 16">
    </div>

    <div class="row">
      <label class="muted">
        <input id="agreeChk" type="checkbox">
        I agree to the <a href="policy.html">Terms & Privacy</a>
      </label>
    </div>

    <div class="row" style="margin-top:1rem;">
      <button class="primary" type="button"
        onclick="

  const age=Number(document.getElementById('ageInput').value);
  const agree=document.getElementById('agreeChk').checked;
  const msg=document.getElementById('msg');

  msg.style.display='none';
  if(!agree){ msg.textContent='Please accept the Terms & Privacy.'; msg.style.display='block'; return; }
  if(!age || age<13){ msg.textContent='Enter a valid age (13+).'; msg.style.display='block'; return; }

  const KEY='delulu_data_v1';
  let data={}; try{ data=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ data={}; }
  data.age=age;
  data.mode=(age<18)?'teen':'adult';
  localStorage.setItem(KEY, JSON.stringify(data));

  location.href='menu.html';
">Continue</button>

          location.href = (age<18) ? 'under18.html' : 'scan.html';
        ">
        Continue
      </button>

      <button class="secondary" type="button"
        onclick="localStorage.removeItem('delulu_data_v1'); alert('Reset done.');">
        Reset
      </button>
    </div>

    <div id="msg" class="notice" style="display:none; margin-top:1rem;"></div>
  </div>
</div>

<div class="footer">If a button doesn’t work on GitHub Pages, it’s usually file name / case.</div>

</body>
</html>
