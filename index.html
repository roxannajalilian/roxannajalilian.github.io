<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Age Check</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Age verification</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn" href="menu.html">Menu</a>
    </div>
  </nav>

  <div class="container">
    <div class="card" style="max-width:720px;margin:0 auto;">
      <h1 style="margin-bottom:6px;">Start</h1>
      <p class="muted">Enter your age to continue. You must be 18 or older.</p>

      <div class="section">
        <label class="muted" for="ageInput" style="display:block;margin-bottom:8px;">Your age</label>
        <input id="ageInput" type="number" inputmode="numeric" min="1" max="120" placeholder="18" />
        <p class="muted" id="errorText" style="margin-top:10px; display:none;"></p>

        <div class="row" style="margin-top:14px;">
          <!-- IMPORTANT: type="button" so it doesn't act weird like a form submit -->
          <button class="btn primary" id="continueBtn" type="button">Continue</button>
          <button class="btn ghost" id="resetBtn" type="button">Reset Age</button>
        </div>
      </div>

      <div class="section item" id="lockBox" style="display:none;">
        <h2 style="margin:0 0 6px;">Sorry — 18+ only</h2>
        <p class="muted" id="lockMsg" style="margin:0;">
          You will be redirected.
        </p>
      </div>
    </div>
  </div>

  <script>
    const APP_KEY = "dd_app_v1";

    function getAppData(){
      try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); }
      catch { return {}; }
    }
    function setAppData(data){
      localStorage.setItem(APP_KEY, JSON.stringify(data));
    }

    const ageInput = document.getElementById("ageInput");
    const continueBtn = document.getElementById("continueBtn");
    const resetBtn = document.getElementById("resetBtn");
    const errorText = document.getElementById("errorText");
    const lockBox = document.getElementById("lockBox");
    const lockMsg = document.getElementById("lockMsg");

    // If already verified, skip
    (function(){
      const data = getAppData();
      if (data && data.age >= 18){
        window.location.href = "menu.html";
      }
    })();

    function showError(msg){
      errorText.style.display = "block";
      errorText.textContent = msg;
    }
    function clearError(){
      errorText.style.display = "none";
      errorText.textContent = "";
    }

    function lockOut(msg){
      lockBox.style.display = "block";
      lockMsg.textContent = msg;

      // kick them out of your site after a second
      setTimeout(() => {
        window.location.href = "https://www.google.com";
      }, 1200);
    }

    continueBtn.addEventListener("click", () => {
      clearError();

      const age = Number(ageInput.value);

      if (!age || age < 1 || age > 120){
        showError("Enter a valid age (1–120).");
        return;
      }

      const data = getAppData();
      data.age = age;
      setAppData(data);

      if (age < 18){
        lockOut("Sorry — you must be 18 or older to use this app.");
        return;
      }

      window.location.href = "menu.html";
    });

    resetBtn.addEventListener("click", () => {
      localStorage.removeItem(APP_KEY);
      ageInput.value = "";
      clearError();
      lockBox.style.display = "none";
    });
  </script>
</body>
</html>
