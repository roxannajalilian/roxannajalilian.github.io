<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Start</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Age verification</div>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card center">
    <h1>Start</h1>
    <p class="muted">Enter your age to continue. You must be <b>18+</b>.</p>

    <div class="field">
      <label class="muted">Your age (18+)</label>
      <input id="ageInput" type="number" min="18" max="120" placeholder="e.g., 19" />
    </div>

    <div class="row" style="justify-content:flex-start; margin-top:10px;">
      <label class="muted">
        <input id="agreeChk" type="checkbox" />
        I agree to the <a href="policy.html">Terms & Privacy</a>
      </label>
    </div>

    <div class="row" style="margin-top:16px;">
      <button class="primary" type="button" id="continueBtn">Continue</button>
      <button class="secondary" type="button" id="resetBtn">Reset</button>
    </div>

    <div id="msg" class="notice" style="display:none;"></div>
  </div>
</div>

<div class="footer">Delulu Detector a quiz, analyzer, mini-game for friends!/CSS/JS</div>

<script src="storage.js"></script>
<script>
  function showError(text){
    const msg = document.getElementById("msg");
    msg.textContent = text;
    msg.style.display = "block";
  }

  document.getElementById("continueBtn").addEventListener("click", () => {
    const age = Number(document.getElementById("ageInput").value);
    const agree = document.getElementById("agreeChk").checked;

    if (!agree) {
      showError("Please accept the Terms & Privacy.");
      return;
    }

    // ✅ PUT YOUR CODE HERE
    if (!age) {
      showError("Enter a valid age.");
      return;
    }

    if (age < 18) {
      lockOut("Sorry — you must be 18 or older to use this app.");
      return;
    }

    // ✅ ONLY 18+ USERS REACH HERE
    const data = getData();
    data.age = age;
    setData(data);

    window.location.href = "menu.html";
  });
</script>
</body>
</html>
