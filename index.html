<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector</title>

  <link rel="stylesheet" href="style.css" />
  <script src="shared.js"></script>

  <style>
    /* index specific */
    .center-stack{
      display:flex;
      flex-direction:column;
      gap: 14px;
    }

    .hero-panel{
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.03));
      padding: 18px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
    }

    .hero-panel h2{
      margin:0 0 10px;
      font-size: 24px;
      font-weight: 950;
    }

    .hero-panel p{
      margin:0;
      color: rgba(255,255,255,.72);
      line-height: 1.35;
    }

    .row-actions{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
      align-items:center;
    }

    .ghost-btn{
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.14);
      color: rgba(255,255,255,.88);
      padding: 10px 14px;
      border-radius: 999px;
      font-weight: 850;
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      gap: 10px;
      min-height: 42px;
      transition: transform .12s ease, filter .12s ease, opacity .12s ease;
    }
    .ghost-btn:hover{ transform: translateY(-1px); filter: brightness(1.06); }
    .ghost-btn:active{ transform: translateY(0); }

    .hint{
      font-size: 12px;
      color: rgba(255,255,255,.62);
      margin-top: 6px;
    }

    .loading{
      display:inline-flex;
      align-items:center;
      gap: 10px;
      color: rgba(255,255,255,.70);
      font-weight: 800;
    }
    .dot{
      width: 8px; height: 8px; border-radius: 999px;
      background: rgba(255,255,255,.55);
      box-shadow: 0 0 14px rgba(185,131,255,.25);
      animation: pop 1s ease-in-out infinite alternate;
    }
    .dot:nth-child(2){ animation-delay:.2s; }
    .dot:nth-child(3){ animation-delay:.4s; }
    @keyframes pop{
      from{ transform: translateY(0); opacity:.55; }
      to{ transform: translateY(-4px); opacity:1; }
    }
  </style>
</head>

<body>
  <div class="mock-wrap">
    <div class="mock-app">
      <div class="stars"></div>

      <!-- Header -->
      <div class="mock-header">
        <div class="mock-brand">
          <div class="mock-icon">DD</div>
          <div style="min-width:0;">
            <h1 class="mock-title">Delulu Detector</h1>
            <p class="mock-sub">Your app-style home screen</p>
          </div>
        </div>

        <div class="mock-chip">v1</div>
      </div>

      <div class="mock-panels center-stack">

        <div class="hero-panel">
          <h2>Welcome</h2>
          <p>
            This app helps you “check the delulu” using a quiz, a plan, and text analysis.
            To continue, you’ll need to verify your age and accept the Terms.
          </p>

          <div class="row-actions">
            <button id="go" class="mock-cta" type="button">
              Continue <span class="mock-arrow">›</span>
            </button>
            <button class="ghost-btn" data-reset-app type="button">Reset App</button>
          </div>

          <div class="hint" id="hint"></div>
        </div>

        <div class="mock-tray">
          <div id="status" class="mock-msg">
            <span class="loading">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              Checking access…
            </span>
          </div>
          <button id="skip" class="ghost-btn" type="button">Go now</button>
        </div>

      </div>

    </div>
  </div>

  <script>
    // decide where user should go
    function decideNext(){
      if (isLocked()) return "locked.html";
      if (!hasAcceptedTerms() || !isAdultVerified()) return "privacy.html?next=menu.html";
      return "menu.html";
    }

    const goBtn = document.getElementById("go");
    const skipBtn = document.getElementById("skip");
    const hint = document.getElementById("hint");

    function go(){
      location.replace(decideNext());
    }

    goBtn.addEventListener("click", go);
    skipBtn.addEventListener("click", go);

    // show hint + auto redirect after a short beat (feels like an app)
    const next = decideNext();
    if (next.startsWith("privacy")) hint.textContent = "You’ll be asked for age + Terms first.";
    else if (next === "locked.html") hint.textContent = "Access is locked (18+ only).";
    else hint.textContent = "Access verified. Sending you to the menu…";

    setTimeout(go, 700);
  </script>
</body>
</html>
