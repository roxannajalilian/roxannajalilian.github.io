<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delulu Detector - Age</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="brand">
    <div class="logo">DD</div>
    <div class="brand-text">
      <div class="title">Delulu Detector</div>
      <div class="sub">Age verification</div>
    </div>
  </div>
</nav>

<main class="container">
  <section class="card center">
    <h1>Start</h1>
    <p class="muted">Enter your age to continue. You must be 18 or older.</p>

    <div class="row">
      <input id="ageInput" class="input" type="number" min="1" max="120" placeholder="Your age" />
      <button id="ageBtn" class="btn btn-primary">Continue</button>
    </div>

    <p id="ageMsg" class="msg"></p>

    <a class="link" href="menu.html">Skip (for testing)</a>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
