<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">18+ only</div>
      </div>
    </div>
    <div class="nav-actions">
      <a class="btn" href="privacy.html">Privacy</a>
      <a class="btn ghost" href="menu.html">Menu</a>
      <button class="btn ghost" id="resetAllTop" type="button">Reset App</button>
    </div>
  </nav>

  <div class="container">
    <div class="card center" style="max-width:760px;margin:0 auto;">
      <h1 style="margin:0 0 6px;">Welcome</h1>
      <p class="muted" style="margin:0;">
        Enter your age to continue. <b>This app is 18+ only.</b>
      </p>

      <div class="section" style="text-align:left;">
        <label class="muted" for="ageInput" style="display:block;margin-bottom:8px;">Your age (must be 18+)</label>

        <!-- Notice: min=18 (no more 1–120) -->
        <input id="ageInput" type="number" inputmode="numeric" min="18" max="120" placeholder="18" />

        <div style="margin-top:12px;">
          <label style="display:flex;gap:10px;align-items:flex-start;">
            <input type="checkbox" id="agreeBox" />
            <span class="small">
              I agree to the <a href="privacy.html" target="_blank"><b>Privacy & Concerns</b></a>
            </span>
          </label>
        </div>

        <p class="muted" id="errorText" style="display:none;margin-top:10px;"></p>

        <div class="row" style="margin-top:14px;">
          <button class="btn primary" id="continueBtn" type="button" disabled>Continue</button>
          <button class="btn ghost" id="resetBtn" type="button">Reset</button>
        </div>
      </div>

      <div class="section item" id="lockBox" style="display:none;">
        <h2 style="margin:0 0 6px;">18+ only</h2>
        <p class="muted" id="lockMsg" style="margin:0;">Redirecting…</p>
      </div>
    </div>
  </div>

  <script>
    const APP_KEY = "dd_app_v1";
    function getAppData(){ try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); } catch { return {}; } }
    function setAppData(d){ localStorage.setItem(APP_KEY, JSON.stringify(d)); }

    const ageInput = document.getElementById("ageInput");
    const agreeBox = document.getElementById("agreeBox");
    const continueBtn = document.getElementById("continueBtn");
    const resetBtn = document.getElementById("resetBtn");
    const resetAllTop = document.getElementById("resetAllTop");
    const errorText = document.getElementById("errorText");
    const lockBox = document.getElementById("lockBox");
    const lockMsg = document.getElementById("lockMsg");

    function showError(msg){ errorText.style.display="block"; errorText.textContent=msg; }
    function clearError(){ errorText.style.display="none"; errorText.textContent=""; }

    agreeBox.addEventListener("change", () => {
      continueBtn.disabled = !agreeBox.checked;
    });

    // ✅ IMPORTANT: do NOT auto-redirect (unless you want it)
    // If you *do* want auto-redirect when verified, I can add it back safely.

    continueBtn.addEventListener("click", () => {
      clearError();
      const age = Number(ageInput.value);

      if (!age || isNaN(age)) {
        showError("Enter your age (18+).");
        return;
      }

      if (age < 18) {
        showError("18+ only. You cannot continue.");
        lockBox.style.display = "block";
        lockMsg.textContent = "18+ only. Redirecting…";
        setTimeout(() => window.location.href = "https://www.google.com", 1200);
        return;
      }

      const data = getAppData();
      data.age = age;
      setAppData(data);

      window.location.href = "menu.html";
    });

    function resetAll(){
      localStorage.removeItem(APP_KEY);
      ageInput.value = "";
      agreeBox.checked = false;
      continueBtn.disabled = true;
      clearError();
      lockBox.style.display = "none";
    }

    resetBtn.addEventListener("click", resetAll);
    resetAllTop.addEventListener("click", resetAll);
  </script>
</body>
</html>
