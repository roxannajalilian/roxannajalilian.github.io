<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delulu Detector – Age</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="brand">
    <div class="logo">DD</div>
    <div class="brand-text">
      <div class="title">Delulu Detector</div>
      <div class="sub">Age verification</div>
    </div>
  </div>
</nav>

<main class="container">
  <section class="card">
    <h1>Start</h1>
    <p class="muted">
      Enter your age to continue. You must be 18 or older.
    </p>

    <div class="field">
      <label for="ageInput">Your age (18+)</label>
      <input
        id="ageInput"
        type="number"
        min="1"
        max="120"
        placeholder="e.g., 18"
        class="input"
      />
    </div>

    <!-- PRIVACY CHECKBOX -->
    <div class="checkbox-row">
      <input type="checkbox" id="agreeBox" />
      <label for="agreeBox">
        I agree to the
        <a href="policy.html" target="_blank">Terms & Privacy</a>
      </label>
    </div>

    <p id="ageMsg" class="msg"></p>

    <div class="actions">
      <button id="continueBtn" class="btn btn-primary" disabled>
        Continue
      </button>
      <button id="resetBtn" class="btn btn-secondary">
        Reset
      </button>
    </div>

    <a href="menu.html" class="link small">
      Skip (for testing)
    </a>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
