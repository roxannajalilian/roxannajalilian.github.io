<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Menu • Delulu Detector</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav>
  <div class="brand">
    <div class="logo">DD</div>
    <div>
      <div class="title">Menu</div>
      <div class="sub">Pick a section</div>
    </div>
  </div>

  <div class="nav-right">
    <a class="navlink active" href="menu.html">Menu</a>
    <a class="navlink" href="quiz.html">Quiz</a>
    <a class="navlink" href="scan.html">Analyze</a>
    <a class="navlink" href="game.html">Mini Game</a>
    <a class="navlink" href="policy.html">Policy</a>
  </div>
</nav>

<div class="container">
  <div class="card center">

    <div class="notice">
      <h3>Analyze</h3>
      <p class="muted">Paste messages → signals + score.</p>
      <button class="primary" type="button" onclick="location.href='scan.html'">Open</button>
    </div>

    <div class="notice" style="margin-top:1rem;">
      <h3>Quiz</h3>
      <p class="muted">~2 mins • accurate % • bestie advice at the end</p>
      <button class="primary" type="button" onclick="location.href='quiz.html'">Open</button>
    </div>

    <div class="notice" style="margin-top:1rem;">
      <h3>Mini Game</h3>
      <p class="muted">Delulu Dash (tap to jump)</p>
      <button class="primary" type="button" onclick="location.href='game.html'">Play</button>
    </div>

    <hr style="border:none;border-top:1px solid rgba(255,255,255,.12);margin:1rem 0;">

    <div class="row" style="justify-content:space-between;flex-wrap:wrap;">
      <button class="secondary" type="button" onclick="history.back()">Back</button>
      <button class="secondary" type="button"
        onclick="localStorage.removeItem('delulu_data_v1'); alert('Reset ✅'); location.href='index.html';">
        Reset data
      </button>
    </div>

  </div>
</div>

</body>
</html>
