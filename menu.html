<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delulu Detector • Menu</title>
  <link rel="stylesheet" href="style.css" />
  <script src="shared.js"></script>
  <script>
    requireAdult(); // 🔒 lock menu
  </script>
</head>
<body>

  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Menu</div>
      </div>
    </div>

    <button class="btn ghost" id="logoutBtn">Log out</button>
  </nav>

  <div class="container">
    <div class="card">
      <h1 style="margin:0 0 10px;">Choose what you want to do</h1>
      <p class="muted">You’re verified and inside the app.</p>

      <div class="grid-2" style="margin-top:16px;">
        <div class="tile">
          <h3>Quiz</h3>
          <p class="muted">Get your delulu percentage.</p>
          <a class="btn primary" href="quiz.html">Start Quiz</a>
        </div>

        <div class="tile">
          <h3>Plan</h3>
          <p class="muted">Personal advice based on your quiz.</p>
          <a class="btn" href="plan.html">View Plan</a>
        </div>

        <div class="tile">
          <h3>Analysis</h3>
          <p class="muted">Scan messages & screenshots.</p>
          <a class="btn" href="scan.html">Open Analysis</a>
        </div>

        <div class="tile">
          <h3>Game</h3>
          <p class="muted">Play the mini game.</p>
          <a class="btn" href="game.html">Play Game</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      clearAppData();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
