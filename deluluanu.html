<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delulu Detector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="topbar">
        <h1>Delulu Detector</h1>
        <p>Find out if you’re overthinking it!</p>
    </header>

    <!-- Age Verification -->
    <section id="age-verification">
        <h2>Enter Your Date of Birth</h2>
        <input type="date" id="dob">
        <button onclick="verifyAge()">Verify Age</button>
        <p id="age-error"></p>
    </section>

    <!-- Minors Quiz (13-17) -->
    <section id="minors-quiz" class="hidden">
        <h2>Delulu Quiz</h2>
        <p>Answer these questions to see if you’re overthinking!</p>
        <div id="quiz-questions">
           
        </div>
        <button onclick="submitQuiz()">Submit Quiz</button>
        <p id="quiz-result"></p>
    </section>

    <!-- Adults Full Features (18+) -->
    <section id="adult-features" class="hidden">
        <h2>Adult Mode</h2>
        <p>Use AI-assisted tools to detect delulu moments!</p>
        <div id="input-methods">
            <button onclick="openMessageAnalyzer()">Message Analyzer</button>
            <button onclick="openScreenShare()">Screen Share</button>
            <button onclick="openVoiceInput()">Voice Input</button>
        </div>

        <div id="feedback">
           
    </section>

    <!-- Appeal Section for Lockout -->
    <section id="appeal-section" class="hidden">
        <h2>Appeal Lockout</h2>
        <p>If you were locked out, submit a reason:</p>
        <textarea id="appeal-text" placeholder="Explain why this was a mistake..."></textarea>
        <button onclick="submitAppeal()">Submit Appeal</button>
        <p id="appeal-feedback"></p>
    </section>

    <script src="script.js"></script>
</body>
</html>
