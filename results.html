<div class="card center">
  <div class="split">
    <h2>Your Score</h2>
    <button id="toMenu" class="secondary">Menu</button>
  </div>

  <div id="percent" class="big-number">—%</div>
  <div id="tier" class="pill">—</div>

  <hr>

  <p id="bestieText" class="friend"></p>

  <div class="notice">
    <b>Why might you feel this way?</b>
    <div class="chips" id="whyChips" style="margin-top:.6rem;"></div>
    <div class="muted small" style="margin-top:.5rem;">Pick 1–2 that match you. It’ll adjust the advice.</div>
  </div>

  <div class="row" style="margin-top:1rem;">
    <button id="toPlan" class="primary">Action Plan</button>
    <button id="redo" class="secondary">Change answers</button>
    <button id="save" class="secondary">Save to History</button>
  </div>
</div>
