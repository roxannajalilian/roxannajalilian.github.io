<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Results</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Your Results</div>
        <div class="sub">Saved + used for your plan</div>
      </div>
    </div>
    <div class="nav-right">
      <a class="navlink" href="menu.html">Menu</a>
      <a class="navlink active" href="plan.html">Plan</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card">
    <div class="row spread">
      <div>
        <h2 id="tier">—</h2>
        <div class="muted" id="vibe">—</div>
      </div>
      <span class="pill" id="datePill">—</span>
    </div>

    <div class="circleWrap">
      <div class="circle">
        <div>
          <div class="big" id="pct">--%</div>
          <div class="label">Delulu Level</div>
        </div>
      </div>
    </div>

    <hr/>

    <p id="explain" class="muted" style="margin:0 0 10px;">—</p>
    <p id="advice" style="margin:0;">—</p>

    <div class="row" style="margin-top:18px;">
      <button class="primary" onclick="location.href='plan.html'">Go to Plan</button>
      <button class="secondary" onclick="location.href='menu.html'">Back to Menu</button>
      <button class="secondary" onclick="location.href='quiz.html'">Retake Quiz</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script>
  requireAdultOrRedirect();
  const data = getData();
  const r = data.quizResult;

  if (!r) {
    alert("No quiz result saved yet. Take the quiz first.");
    location.href = "quiz.html";
  } else {
    document.getElementById("pct").textContent = r.percentage + "%";
    document.getElementById("tier").textContent = r.tier;
    document.getElementById("vibe").textContent = r.vibe || "";
    document.getElementById("explain").textContent = r.explanation;
    document.getElementById("advice").textContent = r.advice;

    const d = new Date(r.at || Date.now());
    document.getElementById("datePill").textContent =
      "Saved: " + d.toLocaleString();
  }
</script>
</body>
</html>
