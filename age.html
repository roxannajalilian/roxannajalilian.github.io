<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Age Verification</title>
  <link rel="stylesheet" href="style.css" />
  <script src="shared.js"></script>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>Age Verification</h1>
      <p class="muted">You must be 18+ to continue.</p>

      <input id="age" type="number" min="1" placeholder="Enter your age (e.g., 18)" />
      <button id="enterBtn" style="margin-top:12px;" type="button">Enter</button>
    </div>
  </div>

  <script>
    // Must accept terms before age
    if (!hasAcceptedTerms()) {
      location.replace("privacy.html?next=" + encodeURIComponent(safeNextFromURL("index.html")));
    }
    if (isLocked()) location.replace("locked.html");
    if (isAdultVerified()) location.replace(safeNextFromURL("index.html"));

    const input = document.getElementById("age");
    const btn = document.getElementById("enterBtn");

    btn.addEventListener("click", () => {
      const res = verifyAge(input.value);

      if (!res.ok && res.reason === "invalid") {
        alert("Enter a valid age.");
        return;
      }

      if (!res.ok && res.reason === "under18") {
        location.replace("locked.html");
        return;
      }

      location.replace(safeNextFromURL("index.html"));
    });
  </script>

</body>
</html>
