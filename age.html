<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Age Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="particle-bg"></canvas>
  <div class="box glow">
    <h2>Are you 18 or older?</h2>
    <button onclick="window.location.href='quiz.html'" class="glow-btn">Yes</button>
    <button onclick="alert('You cannot enter the app if you are under 18.')" class="glow-btn">No</button>
    <p style="margin-top:10px; font-size:0.8em;">We don’t collect personal info. This is safe and secure.</p>
  </div>
  <script src="particles.js"></script>
</body>
</html>
