<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Age Check</title>
  <link rel="stylesheet" href="style.css">
  <script src="shared.js"></script>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Age Verification</h1>
      <p>You must be 18+ to continue.</p>

      <input id="age" type="number" placeholder="Enter age" />
      <button id="enter">Enter</button>
    </div>
  </div>

  <script>
    // Must accept terms before age
    const g = getGate();
    if (!g.termsAccepted) window.location.href = "privacy.html";
    if (g.locked) window.location.href = "locked.html";
    if (g.ageVerified) window.location.href = "index.html";

    document.getElementById("enter").addEventListener("click", () => {
      const age = Number(document.getElementById("age").value);

      if (!age) return alert("Enter a valid age.");

      const gate = getGate();

      if (age < 18) {
        gate.locked = true;
        setGate(gate);
        window.location.href = "locked.html";
        return;
      }

      gate.ageVerified = true;
      setGate(gate);
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
