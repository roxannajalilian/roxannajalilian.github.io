<!DOCTYPE html>
<html>
<head>
  <title>Delulu Results</title>
  <link rel="stylesheet" href="style-ai.css">
</head>
<body>
  <div class="box glow">
    <h2>Your Delulu Analysis</h2>
    <p id="analysis"></p>
    <a href="index.html"><button>Retake Quiz</button></a>
  </div>

  <script>
    let score = parseInt(localStorage.getItem("score"));
    let percent = Math.round((score / 30) * 100);
    let text = "";

    if (score <= 9) {
      text = "You generally interpret messages realistically and avoid overthinking.";
    } else if (score <= 19) {
      text = "You sometimes overthink communication, especially when responses are unclear.";
    } else {
      text = "You often overanalyze texting patterns and assign extra meaning where none exists.";
    }

    document.getElementById("analysis").textContent =
      percent + "% – " + text;
  </script>
</body>
</html>
