<!DOCTYPE html>
<html>
<head>
  <title>Delulu Analysis</title>
  <link rel="stylesheet" href="style-ai.css">
</head>
<body>
  <div class="box glow">
    <h2>Your Delulu Analysis</h2>
    <p id="analysis"></p>
    <button onclick="retake()">Retake Quiz</button>
  </div>

  <script>
    let score = localStorage.getItem("score");
    let maxScore = 25*3;
    let percent = Math.round((score/maxScore)*100);
    let text="", advice="";

    if(percent < 35){
      text = "You rarely overthink messages. You tend to interpret messages calmly and realistically.";
      advice = "Keep trusting your judgment and avoid unnecessary worry. Keep communication open and honest.";
    } else if(percent < 70){
      text = "You sometimes overthink messages. You notice small details and read between the lines often.";
      advice = "Try to pause and not assign extra meaning. Communicate openly, and don't let small uncertainties stress you.";
    } else {
      text = "You often overanalyze messages. You may assume meaning that isn't there.";
      advice = "Take breaks from overthinking. Clarify doubts directly, focus on your well-being, and remember that not everything needs a response immediately.";
    }

    document.getElementById("analysis").innerHTML =
      "<b>Score:</b> "+percent+"%<br><br>"+text+"<br><br><b>Advice:</b> "+advice;

    function retake(){ window.location.href="index.html"; }
  </script>
</body>
</html>
