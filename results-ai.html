<!DOCTYPE html>
<html>
<head>
  <title>Delulu Analysis</title>
  <link rel="stylesheet" href="style-ai.css">
</head>
<body>
  <div class="box glow">
    <h2>Your Delulu Analysis</h2>
    <p id="analysis"></p>
    <a href="index.html"><button>Retake Quiz</button></a>
  </div>

  <script>
    let score = localStorage.getItem("score");
    let totalQuestions = 15;
    let percent = Math.round((score / (totalQuestions * 2)) * 100);
    let text = "";

    if (score <= 9) {
      text = "You generally interpret messages realistically and avoid overthinking.";
    } else if (score <= 19) {
      text = "You sometimes overthink communication, especially when responses are unclear.";
    } else {
      text = "You often overanalyze texting patterns and assign meaning where none exists.";
    }

    document.getElementById("analysis").innerText = percent + "% – " + text;
  </script>
</body>
</html>
