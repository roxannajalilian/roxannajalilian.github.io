<!DOCTYPE html>
<html>
<head>
  <title>Delulu Analysis</title>
  <link rel="stylesheet" href="style-ai.css">
</head>
<body>
  <div class="box glow">
    <h2>Your Delulu Analysis</h2>
    <p id="analysis"></p>
    <button onclick="retake()">Retake Quiz</button>
  </div>

  <script>
    let score = localStorage.getItem("score");
    let percent = Math.round((score / (25*2)) * 100); // max score 50
    let text = "";

    if (percent < 35) {
      text = "You are generally calm and rarely overthink messages.";
    } else if (percent < 70) {
      text = "You sometimes overthink messages and may read into things.";
    } else {
      text = "You often overanalyze text conversations and assume meaning where none exists.";
    }

    document.getElementById("analysis").innerText = percent + "% – " + text;

    function retake() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
