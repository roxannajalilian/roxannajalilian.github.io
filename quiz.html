<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Quiz</div>
        <div class="sub">Answer honestly</div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="btn ghost" id="backBtn" type="button">Back</button>
      <a class="btn" href="menu.html">Menu</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="scan.html">Analysis</a>
      <a class="btn ghost" href="game.html">Game</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="badge" id="qCount">Question 1/10</div>
      </div>

      <h2 style="margin-top:12px;" id="questionText">Loading…</h2>
      <p class="muted" id="questionHint">Tap a choice.</p>

      <div class="section">
        <div class="row">
          <button class="btn primary" data-val="3" type="button">Yes (a lot)</button>
          <button class="btn" data-val="2" type="button">Sometimes</button>
          <button class="btn" data-val="1" type="button">Rarely</button>
          <button class="btn ghost" data-val="0" type="button">No</button>
        </div>
      </div>

      <div class="section" id="resultArea" style="display:none;">
        <h2>Your Result</h2>

        <div class="progress" style="margin:10px 0 10px;">
          <div id="bar"></div>
        </div>

        <h3 id="percentText">0%</h3>
        <p class="muted" id="adviceText"></p>

        <!-- NEW: more percentage examples -->
        <p class="muted" id="rangeLabel" style="margin-top:10px;"></p>
        <div class="item" id="examplesBox" style="margin-top:12px;"></div>

        <div class="row" style="margin-top:12px;">
          <a class="btn primary" href="plan.html">See Your Plan</a>
          <a class="btn" href="menu.html">Menu</a>
          <button class="btn ghost" id="restartQuiz" type="button">Restart Quiz</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Back button fix
    document.getElementById("backBtn").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "menu.html";
    });

    // Age gate
    const APP_KEY="dd_app_v1";
    function getAppData(){ try { return JSON.parse(localStorage.getItem(APP_KEY) || "{}"); } catch { return {}; } }
    const d=getAppData();
    if(!d.age || Number(d.age) < 18) window.location.href="index.html";
  </script>

  <script src="quiz.js"></script>
</body>
</html>
