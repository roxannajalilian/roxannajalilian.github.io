<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delulu Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Quiz</div>
        <div class="sub">Answer honestly (it’s for fun)</div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="pill" id="menuBtn">Menu</button>
      <button class="pill" id="policyBtn">Policy</button>
    </div>
  </nav>

  <main class="container">
    <div class="card">
      <div class="topline">
        <div id="qCount" class="muted">Question 1 of 20</div>
        <div class="pill subtle" id="saveStatus">Not saved yet</div>
      </div>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>

      <h2 id="questionText">…</h2>

      <div class="answers">
        <button class="choice" data-val="0">No</button>
        <button class="choice" data-val="1">Sometimes</button>
        <button class="choice" data-val="2">Yes</button>
        <button class="choice" data-val="3">All the time</button>
      </div>

      <div class="bottomRow">
        <button class="btn ghost" id="returnBtn">Return</button>
        <button class="btn primary" id="nextBtn">Next</button>
      </div>

      <p class="tiny muted centerText">Tip: you can’t skip a question • “Return” goes back one question</p>
    </div>

    <div class="card hidden" id="resultCard">
      <div class="resultGrid">
        <div>
          <h1 id="resultTitle">Your result</h1>
          <p class="muted" id="resultSubtitle"></p>
          <p id="resultPara"></p>
          <div class="row">
            <button class="btn ghost" id="restartBtn">Restart</button>
            <a class="btn primary" href="scan.html">Try Text Analyzer</a>
          </div>
        </div>

        <div class="circleWrap">
          <div class="circle" id="resultCircle">
            <div class="circleInner">
              <div class="big" id="resultPct">--%</div>
              <div class="muted tiny">delulu score</div>
            </div>
          </div>
          <div class="tiny muted centerText" id="modeTag"></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="quiz.js"></script>
</body>
</html>
