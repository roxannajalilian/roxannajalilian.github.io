<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delulu Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="quiz-app">
  <h2 id="question-title">Loading quiz…</h2>
  <p id="question-text"></p>
  <div id="options">
    <button onclick="answer(0)">No</button>
    <button onclick="answer(1)">Sometimes</button>
    <button onclick="answer(2)">Yes</button>
  </div>
  <div class="progress"><span id="progress-bar"></span></div>
</div>
<script src="script.js"></script>
</body>
</html>
