<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Quiz</title>
  <link rel="stylesheet" href="style.css" />
  <script src="quiz.js" defer></script>
</head>

<body>

  <!-- TOP NAV -->
  <nav class="topnav">
    <div class="brand">
      <div class="logo">DD</div>
      <div class="brandText">
        <div class="brandTitle">Delulu Quiz</div>
        <div class="brandSub">Answer honestly</div>
      </div>
    </div>

    <div class="navBtns">
      <button class="navBtn" id="btnBack" type="button">Back</button>
      <button class="navBtn" id="btnMenu" type="button">Menu</button>
      <button class="navBtn" id="btnPlan" type="button">Plan</button>
      <button class="navBtn" id="btnAnalysis" type="button">Analysis</button>
      <button class="navBtn" id="btnGame" type="button">Game</button>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="page">
    <section class="card quizCard">

      <div class="pillRow">
        <div class="pill" id="qCounter">Question 1/10</div>
      </div>

      <h1 class="qTitle" id="qText">Loading...</h1>
      <p class="muted" id="qHint">Tap a choice.</p>

      <div class="answers" id="answers">
        <button class="choice" data-value="3" type="button">Yes (a lot)</button>
        <button class="choice" data-value="2" type="button">Sometimes</button>
        <button class="choice" data-value="1" type="button">Rarely</button>
        <button class="choice" data-value="0" type="button">No</button>
      </div>

      <hr class="divider" />

      <div class="quizFooter">
        <div class="mutedSmall" id="progressText">Progress: 0%</div>
        <button class="secondaryBtn" id="btnRestart" type="button">Restart</button>
      </div>

    </section>
  </main>

</body>
</html>
