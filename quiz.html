<!DOCTYPE html>
<html>
<head>
  <title>Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <h2>Delulu Quiz</h2>

  <p>Do they take a long time to reply?</p>
  <select id="q1">
    <option value="0">No</option>
    <option value="5">Sometimes</option>
    <option value="10">Yes</option>
  </select>

  <p>Have they clearly said they like you?</p>
  <select id="q2">
    <option value="0">Yes</option>
    <option value="5">It's complicated</option>
    <option value="10">No, but I feel it</option>
  </select>

  <p>Do you see signs in small things?</p>
  <select id="q3">
    <option value="0">No</option>
    <option value="5">Sometimes</option>
    <option value="10">Yes</option>
  </select>

  <button onclick="calculateQuiz()">See Results</button>
</div>
<script src="script.js"></script>
</body>
</html>
