<!DOCTYPE html>
<html>
<head>
  <title>Delulu Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="scan.html">Scan</a>
  <a href="quiz.html" class="active">Quiz</a>
  <a href="history.html">History</a>
</nav>

<div class="card quiz-card">
  <h2>Overthinking Questionnaire</h2>

  <div id="progressText" class="muted"></div>
  <div class="progress-bar">
    <div id="progressFill"></div>
  </div>

  <p id="questionText" class="question-text"></p>

  <div class="answers">
    <button class="answer" data-value="0">No</button>
    <button class="answer" data-value="1">Sometimes</button>
    <button class="answer" data-value="2">Yes</button>
    <button class="answer" data-value="3">All the time</button>
  </div>

  <div class="quiz-controls">
    <button id="backBtn" class="secondary">Return</button>
    <button id="nextBtn">Next</button>
  </div>
</div>

<script src="core.js"></script>
<script src="quiz.js"></script>
</body>
</html>
