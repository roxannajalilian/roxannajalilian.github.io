<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css?v=20" />

  <!-- 🔒 lock -->
  <script src="shared.js?v=20"></script>

<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Game</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="scan.html">Analysis</a>
    </div>

  <div class="container">
    <div class="card">
      <h2 style="margin:0 0 6px;">Delulu Dodge</h2>
      <p class="muted" style="margin:0 0 12px;">Move ← → (or A/D). Avoid the red flags.</p>

      <div style="border-radius:18px; border:1px solid rgba(255,255,255,.12); overflow:hidden; background:rgba(0,0,0,.18);">
        <canvas id="c" width="920" height="440" style="width:100%; display:block;"></canvas>

      <div class="row" style="margin-top:12px;">
        <button class="btn primary" id="restartGame" type="button">Restart</button>
        <a class="btn" href="menu.html">Back to Menu</a>
      </div>

      <div id="loseOverlay" class="tile section" style="display:none;">
        <h3 style="margin:0 0 6px;">You lost 😭</h3>
        <p class="muted" style="margin:0 0 12px;">Good try. Want to run it back?</p>
        <div class="row">
          <button class="btn primary" id="overlayRestart" type="button">Restart</button>
          <a class="btn" href="menu.html">Menu</a>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js?v=20"></script>
