<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Mini Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Dodge</div>
        <div class="sub">Avoid the red flags and survive</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn" href="menu.html">Menu</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="badge" id="scoreBadge">Score: 0</div>
        <div class="badge">Move: ← →</div>
      </div>

      <div class="section">
        <canvas id="c" width="900" height="440"></canvas>
      </div>

      <p class="muted" style="margin-top:12px;">
        Tip: Don’t let the red flags hit you.
      </p>
    </div>
  </div>

  <div id="loseOverlay" class="overlay hidden">
    <div class="overlay-card">
      <h2>Oh you lost 😭</h2>
      <p class="muted">Good try. Run it back?</p>
      <div class="row">
        <button class="btn primary" id="restartBtn">Restart</button>
        <a class="btn" href="menu.html">Menu</a>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
