<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delulu Detector • Game</title>

  <link rel="stylesheet" href="style.css?v=1" />

  <style>
    .game-wrap{
      position:relative;
      margin-top:14px;
      border-radius:22px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.15);
      background:rgba(0,0,0,.15);
    }
    #gameCanvas{ width:100%; display:block; }
    .gameover{
      position:absolute; inset:0;
      display:none;
      align-items:center; justify-content:center;
      background:rgba(0,0,0,.6);
      backdrop-filter:blur(8px);
    }
    .gameover-card{
      width:min(420px,92%);
      padding:18px;
      border-radius:22px;
      border:1px solid rgba(255,255,255,.14);
      background:linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.05));
      text-align:center;
    }
  </style>
</head>

<body>

<nav>
  <div class="brand">
    <div class="logo">DD</div>
    <div>
      <div class="title">Delulu Detector</div>
      <div class="sub">Game</div>
    </div>
  </div>
  <div class="nav-actions">
    <a class="btn ghost" href="menu.html">Menu</a>
  </div>
</nav>

<div class="container">
  <div class="card">

    <div class="row" style="justify-content:space-between;align-items:center;">
      <div class="row">
        <span class="badge">Score: <b id="score">0</b></span>
        <span class="badge">High: <b id="highScore">0</b></span>
        <span class="badge">Lives: <b id="lives">3</b></span>
      </div>
      <button class="btn ghost" id="restartBtn">Restart</button>
    </div>

    <p class="muted" style="margin:10px 0;">
      Move with ← → or A / D. Avoid 🚩, catch 💚.
    </p>

    <div class="game-wrap">
      <canvas id="gameCanvas" width="900" height="420"></canvas>

      <div id="gameOver" class="gameover">
        <div class="gameover-card">
          <h2>You lost 😭</h2>
          <p class="muted">Score: <b id="finalScore">0</b></p>
          <div class="row" style="justify-content:center;">
            <button class="btn primary" id="playAgain">Play Again</button>
            <a class="btn" href="menu.html">Menu</a>
          </div>
        </div>
      </div>
    </div>

    <p class="muted small" id="jsStatus" style="margin-top:12px;">
      JS status: waiting…
    </p>

  </div>
</div>

<script src="game.js?v=1"></script>
</body>
</html>
