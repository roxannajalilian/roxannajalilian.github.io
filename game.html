<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Dodge</div>
        <div class="sub">Avoid red flags • survive</div>
      </div>
    </div>
    <div class="nav-right">
      <a class="navlink" href="menu.html">Menu</a>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card">
    <div class="row spread">
      <div class="muted">Move: ← → or A/D • Mobile: drag</div>
      <div class="pill" id="scorePill">Score: 0</div>
    </div>

    <div style="margin-top:12px;">
      <canvas id="c" width="900" height="420" style="width:100%; border-radius:18px; border:1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.25)"></canvas>
    </div>

    <div class="row" style="margin-top:14px;">
      <button class="primary" id="startBtn">Start</button>
      <button class="secondary" id="resetBtn">Reset</button>
      <button class="secondary" onclick="location.href='menu.html'">Back</button>
    </div>

    <div id="gameMsg" class="notice" style="display:none;"></div>
  </div>
</div>

<script src="storage.js"></script>
<script src="game.js"></script>
</body>
</html>
