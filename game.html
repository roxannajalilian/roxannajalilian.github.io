<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css?v=99" />
  <script src="shared.js?v=99"></script>
  <script>requireAdult("game.html");</script>
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Game</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="scan.html">Analysis</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div class="row">
          <span class="badge">Score: <span id="score">0</span></span>
          <span class="badge">Highscore: <span id="highscore">0</span></span>
        </div>
        <div class="row">
          <button class="btn ghost" id="startBtn" type="button">Start</button>
          <button class="btn ghost" id="resetHSBtn" type="button">Reset Highscore</button>
        </div>
      </div>

      <div class="section">
        <p class="muted" style="margin:0 0 10px;">
          Tap / click to jump. Avoid the red flags. If you crash, your score saves as highscore.
        </p>

        <div id="gameWrap" style="
          position:relative;
          width:100%;
          max-width:900px;
          margin:0 auto;
          aspect-ratio: 16 / 7;
          border-radius: 22px;
          overflow:hidden;
          border:1px solid rgba(255,255,255,.12);
          background: rgba(0,0,0,.22);
        ">
          <canvas id="game" style="width:100%; height:100%; display:block;"></canvas>

          <div id="overlay" style="
            position:absolute; inset:0;
            display:flex; align-items:center; justify-content:center;
            background: rgba(0,0,0,.35);
            backdrop-filter: blur(6px);
            opacity:0; pointer-events:none;
            transition: opacity .15s ease;
          ">
            <div class="tile" style="max-width:520px;">
              <h2 style="margin:0 0 6px;">You crashed 😭</h2>
              <p class="muted" id="endText" style="margin:0 0 14px;">—</p>
              <div class="row">
                <button class="btn primary" id="replayBtn" type="button">Replay</button>
                <a class="btn" href="menu.html">Menu</a>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="game.js?v=99"></script>
</body>
</html>
