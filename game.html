<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Delulu Dodge</title>
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Dodge</div>
        <div class="sub">Dodge the delulu. Collect clarity.</div>
      </div>
    </div>

    <div class="nav-actions">
      <button class="pill" id="readBtn">🔊 Read aloud</button>
      <a class="pill" href="menu.html">Menu</a>
    </div>
  </nav>

  <main class="container">
    <div class="card center" style="max-width:900px;margin:0 auto;">
      <h1>Delulu Dodge</h1>
      <p class="muted">
        Move left & right. Avoid delulu thoughts. Collect clarity orbs.
      </p>

      <canvas id="gameCanvas" width="700" height="420"
        style="margin-top:14px;border-radius:18px;border:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35);">
      </canvas>

      <div class="row" style="justify-content:center;margin-top:14px;">
        <button class="btn primary" id="startBtn">Start</button>
        <button class="btn ghost" id="restartBtn">Restart</button>
      </div>

      <p class="tiny muted" id="status" style="margin-top:10px;">
        Controls: ← → arrows or A / D
      </p>
    </div>
  </main>

  <script type="module" src="./game.js"></script>
</body>
</html>
