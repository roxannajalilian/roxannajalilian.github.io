<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css?v=999" />
  <script src="shared.js?v=999"></script>
  <script>requireAdult("game.html");</script>
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Game • Dodge the Flags</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="scan.html">Analysis</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center;">
        <div class="row">
          <span class="badge">Score: <span id="score">0</span></span>
          <span class="badge">High: <span id="high">0</span></span>
          <span class="badge">Lives: <span id="lives">3</span></span>
        </div>
        <button class="btn ghost" id="restart" type="button">Restart</button>
      </div>

      <p class="muted" style="margin:12px 0 10px;">
        Move with ← → (or A / D). Avoid 🚩 red flags. Catch ✅ green flags.
      </p>

      <div style="border:1px solid rgba(255,255,255,.12); border-radius:18px; overflow:hidden;">
        <canvas id="game" width="920" height="420" style="display:block; width:100%; height:auto;"></canvas>
      </div>

      <p class="muted small" id="jsStatus" style="margin:10px 0 0;">JS: waiting…</p>
    </div>
  </div>

  <script src="game.js?v=999"></script>

  <script>

    setTimeout(() => {
      const el = document.getElementById("jsStatus");
      if (el && el.textContent.includes("waiting")) {
        el.textContent = "JS didn't load. Check filename/path + open Console (F12).";
      }
    }, 1200);
  </script>
</body>
</html>
