<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css?v=123" />
  <script src="shared.js?v=123"></script>
  <script>requireAdult("game.html");</script>
</head>
<body>

<nav>
  <div class="brand">
    <div class="logo">DD</div>
    <div>
      <div class="title">Delulu Detector</div>
      <div class="sub">Game • Dodge the Flags</div>
    </div>
  </div>
  <div class="nav-actions">
    <a class="btn ghost" href="menu.html">Menu</a>
    <a class="btn ghost" href="quiz.html">Quiz</a>
    <a class="btn ghost" href="plan.html">Plan</a>
    <a class="btn ghost" href="scan.html">Analysis</a>
  </div>
</nav>

<div class="container">
  <div class="card">

    <div class="row">
      <span class="badge">Score: <b id="score">0</b></span>
      <span class="badge">High: <b id="high">0</b></span>
      <span class="badge">Lives: <b id="lives">3</b></span>
    </div>

    <p class="muted" style="margin-top:8px;">
      Move with ← → or A / D. Avoid 🚩 red flags. Catch ✅ green flags.
    </p>

    <canvas
      id="game"
      width="720"
      height="400"
      style="margin-top:14px; border-radius:16px; background:rgba(0,0,0,.25); display:block;">
    </canvas>

    <div class="row" style="margin-top:14px;">
      <button class="btn ghost" id="restart">Restart</button>
      <span class="muted small" id="jsStatus">Loading game…</span>
    </div>

  </div>
</div>

<script src="game.js?v=123"></script>
</body>
</html>
