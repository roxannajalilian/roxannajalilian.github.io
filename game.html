<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Game</title>
  <link rel="stylesheet" href="style.css?v=99" />
  <script src="game.js?v=99"></script>
  <script>requireAdult("game.html");</script>
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Game • Dodge the Flags</div>
      </div>
    </div>
    <div class="nav-actions">
      <a class="btn ghost" href="menu.html">Menu</a>
      <a class="btn ghost" href="quiz.html">Quiz</a>
      <a class="btn ghost" href="plan.html">Plan</a>
      <a class="btn ghost" href="scan.html">Analysis</a>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="row" style="justify-content:space-between; align-items:center; gap:12px;">
        <div class="row">
          <span class="badge">Score: <span id="score">0</span></span>
          <span class="badge">High: <span id="highScore">0</span></span>
          <span class="badge">Lives: <span id="lives">3</span></span>
        </div>
        <button class="btn ghost" id="restartBtn" type="button">Restart</button>
      </div>

      <p class="muted" style="margin:10px 0 14px;">
        Move with <b>← →</b> (or <b>A / D</b>). Avoid <b>🚩 red flags</b>. Catch <b>💚 green flags</b>.
      </p>

      <div class="game-wrap">
        <canvas id="gameCanvas" width="900" height="420"></canvas>

        <!-- GAME OVER OVERLAY -->
        <div id="gameOver" class="gameover" style="display:none;">
          <div class="gameover-card">
            <h2 style="margin:0 0 6px;">Game Over 😭</h2>
            <p class="muted" style="margin:0 0 12px;">
              You got: <b><span id="finalScore">0</span></b> points
            </p>

            <div class="row" style="justify-content:center; margin-top:10px;">
              <button class="btn primary" id="playAgain" type="button">Play Again</button>
              <a class="btn" href="menu.html">Menu</a>
            </div>

            <p class="muted small" style="margin:14px 0 0; text-align:center;">
              Tip: Don’t chase 🚩. Collect 💚 = consistency.
            </p>
          </div>
        </div>
      </div>

      <p class="muted small" id="jsHint" style="margin-top:12px;"></p>
    </div>
  </div>

  <script src="game.js?v=99"></script>
</body>
</html>
