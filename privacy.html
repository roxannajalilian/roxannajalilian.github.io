<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Locked</title>
  <link rel="stylesheet" href="style.css" />
  <script src="shared.js"></script>
</head>
<body>
  <div class="app-shell">
    <div class="app-top">
      <div class="brand-left">
        <div class="app-icon">DD</div>
        <div>
          <h1 class="hero-title">Delulu Detector</h1>
          <p class="hero-sub">Access restricted</p>
        </div>
      </div>
      <div class="chip">Locked</div>
    </div>

    <div class="stack">
      <div class="panel">
        <h2>Access Locked</h2>
        <p class="help">This app is restricted to users 18 and older.</p>
        <button class="btn" data-reset-app type="button">Reset</button>
      </div>
    </div>
  </div>

  <script>
    if (!isLocked()) location.replace("privacy.html");
  </script>
</body>
</html>
