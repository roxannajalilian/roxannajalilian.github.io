<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Start</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">18+ only</div>
      </div>
    </div>

    <div class="nav-actions">
      <a class="btn ghost" href="privacy.html">Privacy</a>
      <a class="btn ghost" href="menu.html">Menu</a>
      <button class="btn ghost" id="resetAppBtn" type="button">Reset App</button>
    </div>
  </nav>

  <div class="container">
    <div class="card">
      <div class="section">
        <h1 style="margin:0 0 6px;">Welcome</h1>
        <p class="muted" style="margin:0;">Enter your age to continue. This app is <b>18+</b> only.</p>
      </div>

      <div class="section">
        <label for="ageInput">Your age (must be 18+)</label>
        <input id="ageInput" type="number" min="18" max="120" placeholder="18" />

        <div class="row" style="margin-top:10px; justify-content:space-between;">
          <label style="display:flex; gap:10px; align-items:center; margin:0;">
            <input id="agreeChk" type="checkbox" style="width:18px; height:18px;" />
            <span class="muted">I agree to the <a href="privacy.html"><b>Privacy & Concerns</b></a></span>
          </label>
        </div>

        <p class="muted" id="err" style="margin:10px 0 0; display:none;"></p>

        <div class="row" style="margin-top:14px;">
          <button class="btn primary" id="continueBtn" type="button" disabled>Continue</button>
          <button class="btn" id="resetBtn" type="button">Reset</button>
        </div>
      </div>
    </div>
  </div>

  <script src="start.js?v=1"></script>
</body>
</html>
