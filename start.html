<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Age Check</title>
  <link rel="stylesheet" href="style.css?v=20" />
  <script src="shared.js?v=20"></script>
</head>
<body>
 
  <div class="container">
    <div class="card gate-card">
      <div class="gate-head">
        <div class="logo">DD</div>
        <div>
          <h1 class="gate-title">Delulu Detector</h1>
          <p class="muted gate-sub">18+ only</p>
        </div>
      </div>

      <p class="muted" style="margin-top:0;">
        This app is intended for adults. Confirm you are <b>18 or older</b> to access the Menu, Quiz, Plan, Analysis, and Game.
      </p>

      <div class="section">
        <label for="ageInput">Enter your age (18+)</label>
        <input id="ageInput" type="number" inputmode="numeric" min="18" placeholder="18+" />
        <p id="errorText" class="error" style="display:none;"></p>
      </div>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="continueBtn" type="button">Continue</button>
        <a class="btn ghost" href="privacy.html">Privacy</a>
      </div>

      <div class="hr"></div>
      <p class="muted small" style="margin:0;">
        Your age is stored only to verify access (in your browser). No data is sent anywhere.
      </p>
    </div>
  </div>

  <script>
   
    if (isAdultVerified()) {
      location.replace(safeNextFromURL());
    }

    const NEXT = safeNextFromURL();
    const ageInput = document.getElementById("ageInput");
    const continueBtn = document.getElementById("continueBtn");
    const errorText = document.getElementById("errorText");

    function showError(msg){
      errorText.textContent = msg;
      errorText.style.display = "block";
    }

    continueBtn.addEventListener("click", () => {
      const age = Number(ageInput.value);

      if (!age) return showError("Enter your age first.");
      if (age < 18) return showError("Sorry — this app is 18+ only.");

      errorText.style.display = "none";

      const data = getAppData();
      data.age = age;
      data.ageVerifiedAt = Date.now();
      setAppData(data);

      location.href = NEXT; 
    });

    ageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        continueBtn.click();
      }
    });
  </script>
</body>
</html>
