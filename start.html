<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Age Check</title>
  <link rel="stylesheet" href="style.css?v=999" />
  <script src="shared.js?v=999"></script>
</head>
<body>
  <div class="container">
    <div class="card" style="max-width:560px; margin:60px auto;">
      <div style="display:flex; gap:14px; align-items:center; margin-bottom:14px;">
        <div class="logo">DD</div>
        <div>
          <h1 class="glow-title" style="margin:0;">Delulu Detector</h1>
          <p class="muted glow-sub" style="margin:2px 0 0;">18+ only</p>
        </div>
      </div>

      <p class="muted" style="margin-top:0;">
        Confirm you are <b>18 or older</b> to access Menu, Quiz, Plan, Analysis, and Game.
      </p>

      <div class="section">
        <label for="ageInput">Enter your age</label>
        <input id="ageInput" type="number" inputmode="numeric" min="1" placeholder="18+" />
      </div>

      <label class="muted" style="display:flex; gap:10px; align-items:flex-start; margin-top:10px;">
        <input id="termsCheck" type="checkbox" style="width:auto; margin-top:3px;">
        <span>I agree to the <a href="privacy.html"><b>Privacy + Terms</b></a>.</span>
      </label>

      <p id="errorText" style="display:none; margin:10px 0 0; color:#ff8a8a; font-weight:900;"></p>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="continueBtn" type="button">Continue</button>
        <a class="btn ghost" href="privacy.html">Privacy</a>
      </div>

      <div class="hr"></div>
      <p class="muted small" style="margin:0;">
        Age is stored only to verify access (localStorage). No data is sent anywhere.
      </p>
    </div>
  </div>

  <script>
    const NEXT = safeNextFromURL ? safeNextFromURL() : "menu.html";
    const ageInput = document.getElementById("ageInput");
    const continueBtn = document.getElementById("continueBtn");
    const errorText = document.getElementById("errorText");
    const termsCheck = document.getElementById("termsCheck");

    function showError(msg){
      errorText.textContent = msg;
      errorText.style.display = "block";
    }

    continueBtn.addEventListener("click", () => {
      const age = Number(ageInput.value);

      if (!termsCheck.checked) return showError("You have to check the Privacy + Terms box first.");
      if (!age) return showError("Enter your age first.");
      if (age < 18) {
        // lock page name you wanted:
        window.location.href = "locked.html";
        return;
      }

      errorText.style.display = "none";

      const data = getAppData();
      data.age = age;
      data.ageVerifiedAt = Date.now();
      setAppData(data);

      window.location.href = NEXT;
    });

    ageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        continueBtn.click();
      }
    });
  </script>
</body>
</html>
