<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Delulu Detector • Age Check</title>
  <link rel="stylesheet" href="style.css?v=12" />
  <script src="shared.js?v=12"></script>
</head>
<body>
  <!-- NO NAVBAR ON PURPOSE (so they can't leave before verifying) -->

  <div class="container">
    <div class="card" style="max-width:520px; margin:60px auto;">
      <div style="display:flex; gap:14px; align-items:center; margin-bottom:14px;">
        <div class="logo">DD</div>
        <div>
          <h1 style="margin:0;">Delulu Detector</h1>
          <p class="muted" style="margin:2px 0 0;">18+ only</p>
        </div>
      </div>

      <p class="muted" style="margin-top:0;">
        Confirm you are <b>18 or older</b> to access Menu, Quiz, Plan, Analysis, and Game.
      </p>

      <div class="section">
        <label for="ageInput">Enter your age (18+)</label>
        <input
          id="ageInput"
          type="number"
          inputmode="numeric"
          min="18"
          max="120"
          placeholder="18+ only"
          autocomplete="off"
        />
      </div>

      <p id="errorText" style="display:none; margin:8px 0 0; color:#ff8a8a; font-weight:800;"></p>

      <div class="row" style="margin-top:14px;">
        <button class="btn primary" id="continueBtn" type="button">Continue</button>
        <a class="btn ghost" href="privacy.html">Privacy</a>
      </div>

      <div class="hr"></div>
      <p class="muted small" style="margin:0;">
        Age is stored only to verify access (localStorage). No data is sent anywhere.
      </p>
    </div>
  </div>

  <script>
    // If already verified, skip start and go where they wanted
    const current = getAppData();
    if (current?.age && Number(current.age) >= 18) {
      window.location.replace(safeNextFromURL() || "menu.html");
    }

    const ageInput = document.getElementById("ageInput");
    const continueBtn = document.getElementById("continueBtn");
    const errorText = document.getElementById("errorText");

    function showError(msg){
      errorText.textContent = msg;
      errorText.style.display = "block";
    }

    function handleContinue(){
      const age = Number(ageInput.value);

      if (!ageInput.value.trim()) return showError("Enter your age first.");
      if (!Number.isFinite(age)) return showError("Enter a valid number.");
      if (age < 18) return showError("Sorry — this app is 18+ only.");

      errorText.style.display = "none";

      const data = getAppData();
      data.age = age;
      data.ageVerifiedAt = Date.now();
      setAppData(data);

      const next = safeNextFromURL() || "menu.html";
      window.location.replace(next);
    }

    continueBtn.addEventListener("click", handleContinue);

    ageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleContinue();
      }
    });
  </script>
</body>
</html>
