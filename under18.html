<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Access Denied</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<nav>
  <div class="nav-inner">
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Access denied</div>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="card center">
    <h1>Sorry — you can’t use this app</h1>
    <p class="muted" id="reason">This app is 18+.</p>

    <div class="notice" style="display:block; margin-top:14px;">
      You were redirected because you entered an age under 18.
    </div>

    <div class="row" style="margin-top:16px;">
      <button class="primary" id="leaveBtn">Leave site</button>
      <button class="secondary" id="retryBtn">Go back</button>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script>
  const data = getData();
  document.getElementById("reason").textContent =
    data.lockReason || "This app is 18+.";

  // "Leave site" tries to close tab (works best if opened by a click),
  // if browser blocks it, it will just go to a neutral page.
  document.getElementById("leaveBtn").addEventListener("click", () => {
    try { window.close(); } catch (e) {}
    window.location.href = "https://www.google.com";
  });

  // back to index
  document.getElementById("retryBtn").addEventListener("click", () => {
    localStorage.removeItem(KEY);
    window.location.href = "index.html";
  });
</script>
</body>
</html>
