<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Delulu Detector - Plan</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="nav">
  <div class="brand">
    <div class="logo">DD</div>
    <div class="brand-text">
      <div class="title">Delulu Detector</div>
      <div class="sub">My Plan</div>
    </div>
  </div>

  <div class="nav-actions">
    <a class="navlink" href="menu.html">Menu</a>
    <a class="navlink" href="quiz.html">Quiz</a>
    <a class="navlink active planlink" href="plan.html">
      <span class="plan-ico" aria-hidden="true">◎</span>
      <span>Plan</span>
      <span id="planBadge" class="badge">–</span>
    </a>
  </div>
</nav>

<main class="container">
  <section class="card">
    <h1>My Plan</h1>
    <p class="muted">This is based on your most recent quiz score.</p>

    <div class="plan-head">
      <div class="score-mini">
        <div class="score-mini-num" id="planScore">–%</div>
        <div class="muted" id="planLabel">Take the quiz to get a plan.</div>
      </div>
      <a class="btn btn-primary" href="quiz.html">Take / Retake Quiz</a>
    </div>

    <hr class="hr"/>

    <h2>What to do next</h2>
    <ul id="planSteps" class="list"></ul>

    <div class="grid" style="margin-top:14px;">
      <a class="btn btn-ghost" href="menu.html">Return</a>
      <button id="clearBtn" class="btn btn-secondary">Clear Saved Score</button>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
