<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Access Denied</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <nav>
    <div class="brand">
      <div class="logo">DD</div>
      <div>
        <div class="title">Delulu Detector</div>
        <div class="sub">Access restricted</div>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="card center" style="max-width: 900px; margin: 0 auto;">
      <h1 style="margin: 6px 0 10px;">Access denied</h1>
      <p class="muted" id="reason">Sorry — you must be 18+.</p>

      <div class="row" style="justify-content:center; margin-top:16px;">
        <button class="btn ghost" id="clearBtn" type="button">Clear & return</button>
      </div>

      <p class="tiny muted" style="margin-top:12px;">
        If you’re under 18, this app can’t be used.
      </p>
    </div>
  </main>

  <script type="module">
    import { getData, setData } from "./gate.js";

    const data = getData();
    document.getElementById("reason").textContent =
      data?.lockReason || "Sorry — you must be 18 or older to use this app.";

    // Prevent going "back" into the app
    history.pushState(null, "", location.href);
    window.addEventListener("popstate", () => {
      history.pushState(null, "", location.href);
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      setData({});
      window.location.replace("index.html");
    });
  </script>
</body>
</html>
